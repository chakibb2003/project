<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="50%" stop-color="#C6A87C" />
      <stop offset="100%" stop-color="#8C6239" />
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>
  
  <g transform="translate(0, -10)">
    <!-- Outer Moorish Arch -->
    <path d="M100 20 C 120 45, 160 80, 160 130 C 160 160, 160 170, 160 170 L 40 170 C 40 170, 40 160, 40 130 C 40 80, 80 45, 100 20 Z" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Inner Arch -->
    <path d="M100 45 C 115 65, 140 95, 140 135 L 140 165 L 60 165 L 60 135 C 60 95, 85 65, 100 45 Z" fill="none" stroke="url(#gold-light)" stroke-width="2"/>

    <!-- Decorative Interlacing Lines -->
    <path d="M40 130 C 70 120, 80 90, 100 75" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <path d="M160 130 C 130 120, 120 90, 100 75" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    
    <path d="M45 100 C 65 110, 85 140, 85 165" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <path d="M155 100 C 135 110, 115 140, 115 165" fill="none" stroke="url(#gold)" stroke-width="1.5"/>

    <!-- Tajine Dome -->
    <path d="M100 90 C 115 130, 130 145, 130 145 L 70 145 C 70 145, 85 130, 100 90 Z" fill="none" stroke="url(#gold-light)" stroke-width="2.5"/>
    
    <!-- Tajine Top Handle/Knob (Stylized crescent/hook) -->
    <path d="M100 90 C 100 80, 105 78, 105 82 C 105 85, 100 88, 100 90" fill="none" stroke="url(#gold)" stroke-width="2"/>
    
    <!-- Tajine Base -->
    <path d="M60 148 C 60 165, 140 165, 140 148 Z" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    
    <!-- Couscous Texture Details in Tajine Base -->
    <path d="M75 152 Q 85 150 95 154 T 115 152" fill="none" stroke="url(#gold-light)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>
    <path d="M80 156 Q 90 155 100 158 T 120 155" fill="none" stroke="url(#gold-light)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 4"/>
  </g>
</svg>
